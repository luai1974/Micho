{% extends "base.html" %}{% block content %}<div class="card"><h2>{{"עריכת עובד" if emp else "עובד חדש"}}</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>שם מלא</label><input name="name" value="{{emp.name if emp else ''}}" required><label>טלפון</label><input name="phone" value="{{emp.phone if emp else ''}}"><label>שם משתמש</label><input name="username" value="{{emp.username if emp else ''}}" required><label>{{"סיסמה חדשה — ריק = ללא שינוי" if emp else "סיסמה"}}</label><input type="password" name="password" {{"" if emp else "required"}}><label>תעריף לשעה ₪</label><input type="number" step=".01" min="0" name="hourly_rate" value="{{emp.hourly_rate if emp else ''}}" required>{% if emp %}<label><input style="width:auto" type="checkbox" name="active" {% if emp.active %}checked{% endif %}> חשבון פעיל</label><br><br>{% endif %}<button>שמירה</button> <a class="btn secondary" href="{{url_for('dashboard')}}">ביטול</a></form></div>{% endblock %}
