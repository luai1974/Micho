<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול עובדים ושכר</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#182230}.top{background:#142238;color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.card,.stat{background:white;border-radius:14px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.big{font-size:23px;font-weight:bold;margin-top:8px}.btn,button{border:0;border-radius:9px;padding:10px 14px;background:#142238;color:white;text-decoration:none;cursor:pointer}.secondary{background:#667085}.danger{background:#a93226}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ccd3db;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e8eaed;text-align:right}.login{max-width:420px;margin:10vh auto}.flash{padding:12px;background:#fdecec;border-radius:8px}.muted{color:#667085}</style></head><body>
{% if session.uid %}<div class="top"><b>ניהול עובדים ושכר</b><div>{{session.name}} <form style="display:inline" method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="secondary">יציאה</button></form></div></div>{% endif %}
<div class="wrap">{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</div></body></html>
