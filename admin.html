{% extends "base.html" %}{% block content %}<div class="actions"><a class="btn" href="{{url_for('employee_new')}}">+ עובד חדש</a><form><input type="month" name="month" value="{{month}}" onchange="this.form.submit()"></form></div><div class="card"><h2>עובדים — {{month}}</h2><table><tr><th>עובד</th><th>שעות</th><th>לפני מפרעות</th><th>מפרעות</th><th>לתשלום</th><th>פעולות</th></tr>{% for e,h,g,a,n in rows %}<tr><td>{{e.name}}</td><td>{{"%.2f"|format(h)}}</td><td>₪{{"%.2f"|format(g)}}</td><td>₪{{"%.2f"|format(a)}}</td><td><b>₪{{"%.2f"|format(n)}}</b></td><td><div class="actions"><a class="btn" href="{{url_for('employee_detail',eid=e.id,month=month)}}">כרטיס</a><a class="btn secondary" href="{{url_for('employee_edit',eid=e.id)}}">עריכה</a><form method="post" action="{{url_for('employee_delete',eid=e.id)}}" onsubmit="return confirm('למחוק?')"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger">מחיקה</button></form></div></td></tr>{% endfor %}</table></div>{% endblock %}
